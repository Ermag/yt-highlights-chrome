name: Release

# Version bumps stay a manual, human decision (edit package.json's "version" in
# the merged PR, as with past "Release x.y.z: ..." commits). This workflow only
# reacts to that already-decided version landing on main: if `vX.Y.Z` isn't
# tagged yet, verify, build, zip for the Web Store, and cut a GitHub Release.
# A package.json push that doesn't change the version (e.g. a dependency bump)
# is a no-op, since that tag already exists.
on:
    push:
        branches: [main]
        paths:
            - package.json

permissions:
    contents: write

jobs:
    check:
        runs-on: ubuntu-latest
        outputs:
            should_release: ${{ steps.check.outputs.should_release }}
            version: ${{ steps.version.outputs.version }}
            tag: ${{ steps.version.outputs.tag }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - id: version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

            - id: check
              run: |
                  if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
                    echo "should_release=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "should_release=true" >> "$GITHUB_OUTPUT"
                  fi

    release:
        needs: check
        if: needs.check.outputs.should_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run check
            - run: npm run package

            - uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.check.outputs.tag }}
                  name: ${{ needs.check.outputs.tag }}
                  generate_release_notes: true
                  files: highlights-for-youtube-${{ needs.check.outputs.version }}.zip
